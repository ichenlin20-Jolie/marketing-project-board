<title>KINYO 新品通路看板 (Copy)</title>
<style>
:root{--bg:#ffffff;--logo:#231815}
@media (prefers-color-scheme:dark){:root{--bg:#111111;--logo:#f5f5f5}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg)}
.title{margin:-20px 0 0;font-size:clamp(20px,3.2vw,28px);font-weight:500;letter-spacing:.3em;text-indent:.3em;color:var(--logo)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px;padding:24px;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
.enter{display:inline-block;padding:13px 36px;border:1.5px solid var(--logo);border-radius:999px;color:var(--logo);text-decoration:none;font-size:16px;font-weight:500;letter-spacing:.08em;transition:background .2s,color .2s}
.enter:hover,.enter:focus-visible{background:var(--logo);color:var(--bg);outline:none}
.logo{display:block;width:min(300px,56vw);height:auto;fill:var(--logo)}
@media (prefers-reduced-motion:no-preference){.logo{animation:in .8s ease-out both}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
